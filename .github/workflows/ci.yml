name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.css'
      - '**/*.svg'
      - '**/*.json'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - 'vite.config.ts'
      - 'netlify.toml'
      - 'vite.storybook.config.ts'
      - '.storybook/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/netlify-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.css'
      - '**/*.svg'
      - '**/*.json'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - 'vite.config.ts'
      - 'netlify.toml'
      - 'vite.storybook.config.ts'
      - '.storybook/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/netlify-deploy.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test
      - name: Run TypeScript check
        run: npm run typecheck
      - name: Run Biome check
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

      - name: Check Netlify build output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          test -d build/client
          test -f build/server/index.js
          test -f .netlify/v1/functions/react-router-server.mjs

      - name: Upload Netlify build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: netlify-build
          path: |
            build/
            .netlify/v1/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # TurboSnap needs the full Git history.
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitZeroOnChanges: true
          onlyChanged: true # TurboSnap enable
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
